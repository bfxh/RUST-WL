# cargo-deny：依赖层静态审计（公告 / 许可 / 禁用 / 来源）。
# 运行：`cargo deny check`（CI static 层，阻断）。
#
# 纪律背景：引擎 workspace 的第三方依赖是**极小面**（仅 xxhash-rust，见
# crates/vxl-phys-replay）——本文件的作用是给「新增依赖」上锁：任何新依赖
# 必须过许可白名单 + 无公告 + 有明确来源，才允许进入构建图。

[graph]
# 空 targets = 按当前宿主全部 target 检查（CI 三平台各自跑一遍）。
targets = []

[advisories]
version = 2
# 被 yank 的版本一律拒（可复现构建不接受「已撤回」的依赖）。
yanked = "deny"
# 例外的写法：{ id = "RUSTSEC-XXXX-YYYY", reason = "…", expiry = "YYYY-MM-DD" }
# —— 到期后必须重新评估，不允许无声长期豁免。
ignore = [
    # GPU 档（2026-09-23）引入：`paste` 已停止维护（RUSTSEC-2024-0436），但**只有 `metal`
    # （macOS 后端）用它**——依赖链 metal → wgpu-hal，Windows/Linux 构建不含该路径
    # ⇒ 本仓当前目标平台**无暴露**。移除条件：wgpu-hal 换用 `pastey`（README 推荐的 drop-in）。
    { id = "RUSTSEC-2024-0436", reason = "未维护；仅 metal(macOS 后端) 使用，本仓当前平台不含该路径。**复查截止 2027-03-31**（本版 cargo-deny 不支持 expiry 键，故期限记在理由内；到期必须重新评估，不允许无声长期豁免）" },
]

[licenses]
version = 2
# 白名单**只列当前依赖树实际出现的许可**（cargo-deny 会对未出现的条目报
# `license-not-encountered`）——即「新增许可类型必须显式开锁并写理由」：
#   MIT / Apache-2.0  → 本仓自身（workspace.package.license）
#   BSL-1.0           → xxhash-rust（唯一第三方依赖）
# GPU 档（2026-09-23，wgpu 树引入；四条均为宽松/公共领域级，逐条标来源）：
#   Zlib         → foldhash（← hashbrown）        OSI + FSF 双认可
#   CC0-1.0      → hexf-parse（← wgpu-hal）       公共领域奉献
#   ISC          → libloading（← wgpu-hal）       MIT 同族
#   Unicode-3.0  → unicode-ident（← proc-macro2） 宽松（Unicode 数据许可）
allow = ["MIT", "Apache-2.0", "BSL-1.0", "Zlib", "CC0-1.0", "ISC", "Unicode-3.0"]
confidence-threshold = 0.9

[bans]
# 同一 crate 多版本共存 = 依赖树膨胀与不一致风险，先告警暴露。
multiple-versions = "warn"
# 通配版本（"*"）禁止：构建不可复现。workspace 内部 path 依赖天然无版本
# 约束（`{ workspace = true }`），由 allow-wildcard-paths 放行。
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
# 只允许 crates.io 与显式列出的 git 源；未知源一律拒（供应链纪律）。
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
