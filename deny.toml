# cargo-deny 配置（RUST-WL / vxl_phys）
# 目标：§0/§11「许可 MIT OR Apache-2.0；依赖审计禁 GPL 传染」+ §11 依赖漏洞审计（RUSTSEC）。
# 本文件只管依赖审计（独立 CI 作业 `cargo-deny`），不碰既有的轻量 ratchet 层。
# CI 跑 `cargo deny check`（licenses + advisories + bans 全量）。

[advisories]
version = 2
# RUSTSEC 漏洞库默认开启；CI 联网拉 advisory-db。本地沙箱拦截 github git 协议，无法离线预验证，
# 故 advisories 结果以 real-CI 为准。

[licenses]
version = 2
# 允许的宽松许可（与 license-gate 的 PERMISSIVE 口径一致）。
# cargo-deny 中 `allow` 为「许可白名单」：凡不在 allow 里的许可（含 GPL/AGPL/LGPL 家族）一律判违例，
# 因此无需额外 `deny` 列表（且 0.14 的 `deny` 键已 deprecated）。
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "0BSD",
    "BSL-1.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
]
# 0.8：允许 cargo-deny 在较低置信度下判定许可（避免漏判双许可 / 模糊声明）
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "warn"
