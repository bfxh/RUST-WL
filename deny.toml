# cargo-deny 配置（RUST-WL / vxl_phys）
# 目标：§0/§11「许可 MIT OR Apache-2.0；依赖审计禁 GPL 传染」。
# 本文件只管许可审计（独立 CI 作业 `cargo-deny`），不碰既有的轻量 ratchet 层。

[advisories]
version = 2
# 仅做许可审计；advisory/RUSTSEC 库默认开启，但本作业只跑 `cargo deny check licenses`

[licenses]
version = 2
# 允许的宽松许可（与 license-gate 的 PERMISSIVE 口径一致）
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "0BSD",
    "BSL-1.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
]
# 明确禁止的 copyleft / GPL 传染许可（cargo-deny 用裸 GNU id 覆盖 -only/-or-later 两种变体）
deny = [
    "GPL-2.0",
    "GPL-3.0",
    "AGPL-3.0",
    "LGPL-2.1",
    "LGPL-3.0",
]
# 0.8：允许 cargo-deny 在较低置信度下判定许可（避免漏判双许可 / 模糊声明）
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "warn"
