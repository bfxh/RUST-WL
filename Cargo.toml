[workspace]
resolver = "2"
# 依赖 DAG（docs/SPEC.md §1，禁止环）：
#   core <- broad / narrow / integrate / solver / field / replay
#   narrow <- terrain <- vxl-phys(门面)
members = [
    "crates/vxl-phys-core",
    "crates/vxl-phys-broad",
    "crates/vxl-phys-narrow",
    "crates/vxl-phys-solver",
    "crates/vxl-phys-integrate",
    "crates/vxl-phys-field",
    "crates/vxl-phys-terrain",
    "crates/vxl-phys-replay",
    "crates/vxl-phys-soft",
    "crates/vxl-phys-fluid",
    "crates/vxl-phys-splat",
    "crates/vxl-phys-wheeled",
    "crates/vxl-phys-aero",
    "crates/vxl-phys-marine",
    "crates/vxl-phys-mech",
    "crates/vxl-phys-destruction",
    "crates/vxl-phys-gpu",
    "crates/vxl-phys-memfind",
    "crates/vxl-phys-ffi",
    "crates/vxl-phys",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["RUST WL"]

[workspace.dependencies]
# 版本与 path 同时给出：path 供本地 workspace 解析，version 供「若将来发布」
# 与静态审计工具（cargo-deny 需可解析的版本约束）使用。
vxl-phys-core = { version = "0.1.0", path = "crates/vxl-phys-core" }
vxl-phys-broad = { version = "0.1.0", path = "crates/vxl-phys-broad" }
vxl-phys-narrow = { version = "0.1.0", path = "crates/vxl-phys-narrow" }
vxl-phys-solver = { version = "0.1.0", path = "crates/vxl-phys-solver" }
vxl-phys-integrate = { version = "0.1.0", path = "crates/vxl-phys-integrate" }
vxl-phys-field = { version = "0.1.0", path = "crates/vxl-phys-field" }
vxl-phys-fluid = { version = "0.1.0", path = "crates/vxl-phys-fluid" }
vxl-phys-terrain = { version = "0.1.0", path = "crates/vxl-phys-terrain" }
# GPU 档（§8/M4）：统一入口 wgpu（Vulkan/Metal/DX12/WebGPU 由它自选 ⇒ **不绑厂商**）。
# 钉版本 + 基线登记理由见 scripts/deps-baseline.json。
wgpu = "27"
vxl-phys-splat = { version = "0.1.0", path = "crates/vxl-phys-splat" }
vxl-phys-replay = { version = "0.1.0", path = "crates/vxl-phys-replay" }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
